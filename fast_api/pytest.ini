[pytest]
# Pytest configuration for F5-TTS API tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    service: Service layer tests
    slow: Slow running tests

# Coverage (optional)
# addopts = --cov=app --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
